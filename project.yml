name: Noki
options:
  bundleIdPrefix: com.joshuachuah
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: 15.0
targets:
  Noki:
    type: application
    platform: macOS
    sources:
      - path: Noki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshuachuah.Noki
        PRODUCT_NAME: Noki
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Noki controls Spotify playback.
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
    entitlements:
      path: Noki/Noki.entitlements
  NokiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NokiTests
    dependencies:
      - target: Noki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshuachuah.NokiTests
        GENERATE_INFOPLIST_FILE: YES

